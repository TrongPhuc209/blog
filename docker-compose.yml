services:

  # =========================
  # MySQL
  # =========================
  mysql:
    image: mysql:8.4

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    ports:
      - "3307:3306"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s


  # =========================
  # Spring Boot
  # =========================
  backend:
    build:
      context: ./backend

    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true

      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}

      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      JWT_BASE64_SECRET: ${JWT_BASE64_SECRET}

      BLOG_LOG_PATH: /app/blog-logs

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:8080"

    volumes:
      - backend_logs:/app/blog-logs


  # =========================
  # React + Nginx
  # =========================
  frontend:
    build:
      context: ./frontend

      args:
        VITE_API_BASE_URL: /api

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "3000:80"


volumes:

  mysql_data:

  backend_logs: