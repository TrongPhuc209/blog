# application.properties
spring.application.name=blog
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# DATABASE
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${DATABASE_NAME:springsieutoc}?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# REDIS
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT
jwt.base64-secret=${SECRET_KEY}
jwt.access-token-validity=60000
jwt.refresh-token-validity=86400


spring.jpa.open-in-view=false

# Redis fixed-window rate limits. Durations use Spring's Duration format.
rate-limit.login.max-requests=10
rate-limit.login.window=1m
rate-limit.register.max-requests=5
rate-limit.register.window=1h
rate-limit.refresh.max-requests=30
rate-limit.refresh.window=1m

# default page size
spring.data.web.pageable.default-page-size=10

# max page size
spring.data.web.pageable.max-page-size=100

# tác dụng là cho tham số page từ frontend gửi lên bắt đầu là 1 (mặc định là 0)
spring.data.web.pageable.one-indexed-parameters=true

# tắt auto compile khi save
spring.devtools.restart.enabled=false
